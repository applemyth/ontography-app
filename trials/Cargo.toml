[package]
name = "ontography-trials"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Trials of the whole Ontography app: generated workflows on a real server, judged independently"

[dependencies]
ontography = { package = "ontography-core", path = "../../ontography-core" }
ontography-app = { path = ".." }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.29", features = ["process", "signal"] }
rand = "0.9"
rand_chacha = "0.9"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
