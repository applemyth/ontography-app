[package]
name = "ontography-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Persistent graph management and a Rust terminal client for Ontography"

[lib]
name = "ontography_app"

[[bin]]
name = "ontography"
path = "src/main.rs"

[dependencies]
ontography = { package = "ontography-core", path = "../ontography-core" }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
iroh = { version = "1.2.0", default-features = false, features = ["tls-ring"] }
nix = { version = "0.29", features = ["process", "user", "signal", "fs"] }
portable-pty = "0.9"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reflink-copy = "0.1.30"
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
schemars = "1.2.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
